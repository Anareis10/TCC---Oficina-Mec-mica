<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="./style/style_login_cadastro.css">
</head>

<body>

    <section class="fundo">

        <main>

            <section>

                <h2>Log<span class="laranja">in</span></h2>

                <form id="formularioLogin">

                    <div class="input-box">
                        <input type="email" id="email" required>
                        <span>E-mail</span>
                    </div>

                    <div class="input-box">
                        <input type="password" id="senha" required>
                        <span>Senha</span>
                    </div>

                    <div class="lembrar-me">
                        <input type="checkbox" id="0312">
                        <label for="0312">Lembrar-me</label>
                    </div>

                    <button type="submit" class="submit-btn btn__login">
                        Entrar
                    </button>

                </form>

                <p class="button-cadastro">
                    Não tem uma conta?
                    <a href="./cadastro_2.html">Crie uma!</a>
                </p>

            </section>

        </main>

    </section>

    <script src="./js/login.js"></script>

</body>

</html>
