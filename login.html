
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
    <link rel="icon" type="image/png" href="./imagens/logo da Paulo Car.png">
    <link rel="stylesheet" href="./style/style_login_cadastro.css">
</head>

<body>

    <section class="fundo">

        <main>

            <section>

                <h2>Log<span class="laranja">in</span></h2>

                <form id="formularioLogin">

                    <div class="input-box">
                        <select class="opcao" id="tipoLogin" required>
                            <option value="">Entrar como</option>
                            <option value="cliente">Cliente</option>
                            <option value="admin">Administrador</option>
                        </select>

                    </div>

                    <div class="input-box">
                        <input type="email" id="email" required>
                        <span>E-mail</span>
                    </div>

                    <div class="input-box">
                        <input type="password" id="senha" required>
                        <span>Senha</span>
                    </div>

                    <button type="submit" class="submit-btn btn__login">
                        Entrar
                    </button>

                </form>

                <p class="button-cadastro" id="areaCadastro">
                    Não tem uma conta?
                    <a href="./cadastro_2.html">Crie uma!</a>
                </p>

                <p class="button-cadastro" id="recuperacao__senha">
                    Esqueceu a senha?
                    <a href="#">Clique aqui!</a>
                </p>

            </section>

        </main>

    </section>

    <script src="./js/login.js"></script>

</body>

</html>
