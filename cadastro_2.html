<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="./style/style_login_cadastro.css">
</head>

<body>

    <main>

        <section>

            <h2>Criar <span class="laranja">conta</span></h2>

            <form id="formularioCadastro">

                <div class="input-box">
                    <input type="email" id="email" required>
                    <span>E-mail</span>
                </div>

                <div class="input-box">
                    <input type="text" id="nome" required>
                    <span>Nome de usuário</span>
                </div>

                <div class="input-box">
                    <input type="text" id="ddd" required>
                    <span>DDD</span>
                </div>

                <div class="input-box">
                    <input type="text" id="telefone" required>
                    <span>Telefone</span>
                </div>

                <div class="input-box">
                    <input type="password" id="senha" required>
                    <span>Senha</span>
                </div>

                <div class="input-box">
                    <input type="password" id="confirmaSenha" required>
                    <span>Confirme a senha</span>
                </div>

                <form id="formularioCadastro">

    <!-- seus campos -->

                    <button type="submit" class="submit-btn btn__cadastro">Cadastrar</button>

                </form>

            </form>

            <p class="button-login">
                Já tem uma conta?
                <a href="login.html">Clique aqui!</a>
            </p>

        </section>

    </main>

    <script src="./js/cadastro.js"></script>

</body>

</html>
